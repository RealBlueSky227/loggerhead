name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Syntax check
        run: python -m compileall -q loggerhead tests
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest --cov=loggerhead --cov-report=term-missing
